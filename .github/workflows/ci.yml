name: Remote Commander CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  local-contract:
    name: Local contract / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile sources and tests
        run: python -m compileall -q src tests
      - name: Run unit and MCP-stdio protocol tests
        run: python -m unittest discover -s tests -p "test_remote_*.py" -v
      - name: Verify independent repo boundaries
        shell: python
        run: |
          from pathlib import Path
          assert Path("src/orbit_remote_commander.py").is_file()
          assert Path("src/orbit_remote_fallback.py").is_file()
          assert not Path("source/runtime/orbit_mcp.py").exists()
          assert not Path("installer.py").exists()
          assert Path("docs/CHATGPT-COMPATIBILITY.md").is_file()
          print("Standalone boundaries present; no Orbit Core runtime packaged")
